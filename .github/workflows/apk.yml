name: APK Build

# On-demand installable debug APK. Trigger from the Actions tab
# ("Run workflow") or via `gh workflow run apk.yml`.
# Not on push: full RN native builds take ~40 min uncached; CI covers every push.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: release (standalone APK) or debug (dev client for Metro hot-reload)'
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # version comes from package.json "packageManager" (pnpm@9.15.9) — do NOT
      # redeclare it here; pnpm/action-setup errors on conflicting declarations.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Ubuntu runners fill their ~14 GB disk during RN Gradle builds.
      # Remove toolchains an Expo debug build never touches + prune docker.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # Gradle build cache: RN/Expo native artifacts (Hermes, Reanimated AARs,
      # worklets) are the multi-GB cost of every cold build. Caching ~/.gradle
      # cuts repeat builds to a fraction. Cache is keyed on lockfiles +
      # generated android project so dependency changes bust it cleanly.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # engine is TS source consumed via workspace path — ensure it's present
      - name: Generate native android project (expo prebuild)
        run: |
          cd apps/mobile
          pnpm exec expo prebuild --platform android --no-install

      - name: Assemble APK (self-contained JS bundle)
        # assembleDebug would produce a dev APK that requires a Metro server
        # ("Unable to load script" on device). Release embeds the JS bundle and
        # is signed with the debug keystore by the RN template's default
        # signingConfig, so it installs standalone.
        # build_type input: 'release' (default, standalone) or 'debug' (one-time
        # dev-client build for the Metro hot-reload loop).
        env:
          BUILD_TYPE: ${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          # ubuntu-latest has 4 cores / 16 GB — use them (was self-throttled to
          # 2 workers / 3 GB, costing ~40% of build speed).
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4
        run: |
          cd apps/mobile/android
          # Enable Gradle build caching + parallel execution (RN template doesn't
          # guarantee these; with ~/.gradle/caches persisted above, unchanged
          # native modules skip recompilation on repeat builds).
          printf '\norg.gradle.caching=true\norg.gradle.parallel=true\n' >> gradle.properties
          chmod +x gradlew
          ./gradlew assemble$BUILD_TYPE --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abhyas-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
