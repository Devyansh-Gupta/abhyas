name: APK Build

# Every push to main produces an installable debug APK.
# Download: Actions tab → latest "APK Build" run → Artifacts → abhyas-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # version comes from package.json "packageManager" (pnpm@9.15.9) — do NOT
      # redeclare it here; pnpm/action-setup errors on conflicting declarations.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Ubuntu runners fill their ~14 GB disk during RN Gradle builds.
      # Remove toolchains an Expo debug build never touches + prune docker.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # engine is TS source consumed via workspace path — ensure it's present
      - name: Generate native android project (expo prebuild)
        run: |
          cd apps/mobile
          pnpm exec expo prebuild --platform android --no-install

      - name: Assemble debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abhyas-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
